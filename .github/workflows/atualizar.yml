name: Atualizar precos ANP
on:
  schedule:
    - cron: "17 13 * * 1,3,5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python scripts/update.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add postos.json
          git diff --cached --quiet || (git commit -m "Atualiza precos ANP" && git push)
